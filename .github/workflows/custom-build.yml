name: Custom Build

# =============================================================================
# RustDesk 自定义编译 workflow
# 支持: Windows x64, macOS (x86_64 + aarch64), Android arm64, Linux x64
#
# 使用方法：
# 1. 在仓库 Settings → Secrets → Actions 中添加配置变量
# 2. 手动触发此 workflow (Run workflow)，选择目标平台
#
# 所有配置统一使用 Actions Secrets，编译时通过 option_env!() 注入二进制文件
# 编译时环境变量说明见 ENV_VARS.md
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.5.1)"
        required: true
        default: "1.5.1"
        type: string
      build_number:
        description: "构建号 (留空自动用时间戳)"
        required: false
        default: ""
        type: string
      target:
        description: "Build target"
        type: choice
        options:
          - all
          - windows-x64
          - macos
          - android-arm64
          - linux-x64
        default: all
      create_release:
        description: "编译后创建 GitHub Release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ===========================================================================
  # 准备阶段
  # ===========================================================================
  prepare:
    name: Prepare & Show Config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      build_number: ${{ steps.set-version.outputs.build_number }}
      tag: ${{ steps.set-version.outputs.tag }}
    steps:
      - name: Determine version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            BUILD_NUMBER="${{ inputs.build_number }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            BUILD_NUMBER=""
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(date +%s)
          fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Show configuration
        run: |
          echo "============================================"
          echo "  RustDesk Custom Build"
          echo "============================================"
          echo "  Version:      ${{ steps.set-version.outputs.version }}"
          echo "  Build number: ${{ steps.set-version.outputs.build_number }}"
          echo "  Tag:          ${{ steps.set-version.outputs.tag }}"
          echo "  Target:       ${{ inputs.target }}"
          echo ""
          echo "--- Server Configuration (from Secrets) ---"
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}" ]; then echo "  RENDEZVOUS_SERVERS: (set)"; else echo "  RENDEZVOUS_SERVERS: (default: rs-ny.rustdesk.com)"; fi
          if [ -n "${{ secrets.RUSTDESK_API_SERVER }}" ]; then echo "  API_SERVER: (set)"; else echo "  API_SERVER: (not set)"; fi
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}" ]; then echo "  RENDEZVOUS_PORT: (set)"; else echo "  RENDEZVOUS_PORT: (default: 21116)"; fi
          if [ -n "${{ secrets.RUSTDESK_RELAY_PORT }}" ]; then echo "  RELAY_PORT: (set)"; else echo "  RELAY_PORT: (default: 21117)"; fi
          echo "  Updates: PERMANENTLY DISABLED (hardcoded)"
          if [ -n "${{ secrets.RUSTDESK_RS_PUB_KEY }}" ]; then echo "  RS_PUB_KEY: (set)"; else echo "  RS_PUB_KEY: (default official key)"; fi
          if [ -n "${{ secrets.RUSTDESK_PRESET_PASSWORD }}" ]; then echo "  PRESET_PASSWORD: (set)"; else echo "  PRESET_PASSWORD: (not set)"; fi
          echo "============================================"

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    name: Build Windows x86_64
    needs: prepare
    runs-on: windows-2022
    if: github.event_name == 'push' || inputs.target == 'windows-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkg-json: ./vcpkg.json

      - name: Build RustDesk
        run: flutter build windows --release
        env:
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
          VCPKG_ROOT: ${{ steps.setup-vcpkg.outputs.vcpkg-path }}

      - name: Package Windows build
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd flutter/build/windows/x64/runner/Release
          7z a /tmp/rustdesk-${VERSION}-windows-x64.zip .
          echo "Windows package created"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-windows-x64
          path: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
          retention-days: 30

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # macOS (x86_64 + aarch64)
  # ===========================================================================
  build-macos:
    name: Build macOS ${{ matrix.job.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x86_64,
              vcpkg-triplet: x64-osx,
              extra-build-args: "",
              extra-cargo-features: "",
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
              extra-build-args: "--screencapturekit",
              extra-cargo-features: ",screencapturekit",
            }
    runs-on: ${{ matrix.job.os }}
    if: github.event_name == 'push' || inputs.target == 'macos' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i '' "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm yasm pkg-config

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build RustDesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i '' -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i '' -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
        env:
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}

      - name: Create unsigned dmg
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i '' -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${VERSION}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-macos-${{ matrix.job.arch }}
          path: rustdesk-${{ needs.prepare.outputs.version }}-macos-${{ matrix.job.arch }}.dmg
          retention-days: 30

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: rustdesk-${{ needs.prepare.outputs.version }}-macos-${{ matrix.job.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: rustdesk-${{ needs.prepare.outputs.version }}-macos-${{ matrix.job.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Android arm64
  # ===========================================================================
  build-android:
    name: Build Android arm64
    needs: prepare
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || inputs.target == 'android-arm64' || inputs.target == 'all'
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev \
            libclang-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
            libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev \
            nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          ./flutter/build_android_deps.sh "arm64-v8a"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Build RustDesk native lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Use debug signing (no signing key configured)
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          # Copy libc++_shared.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          # Build APK
          cd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          VERSION="${{ needs.prepare.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../rustdesk-${VERSION}-android-arm64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-android-arm64
          path: rustdesk-${{ needs.prepare.outputs.version }}-android-arm64.apk
          retention-days: 30

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: rustdesk-${{ needs.prepare.outputs.version }}-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: rustdesk-${{ needs.prepare.outputs.version }}-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Linux x86_64
  # ===========================================================================
  build-linux:
    name: Build Linux x86_64
    needs: prepare
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || inputs.target == 'linux-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git libgtk-3-dev libxcb1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxkbcommon-dev \
            libxdo-dev libpango1.0-dev libglib2.0-dev libasound2-dev \
            libpulse-dev libdbus-1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev nasm wget unzip

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Build RustDesk
        run: flutter build linux --release
        env:
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}

      - name: Package Linux build
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd flutter/build/linux/x64/release/bundle
          tar czf /tmp/rustdesk-${VERSION}-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-linux-x64
          path: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          retention-days: 30

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
