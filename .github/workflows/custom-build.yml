name: Custom Build

# =============================================================================
# RustDesk 自定义编译 workflow
#
# 使用方法：
# 1. 在仓库 Settings → Secrets and variables → Actions → Secrets 中添加所有变量
# 2. 手动触发此 workflow (Run workflow) 或推送 tag 触发
#
# 所有配置统一使用 Actions Secrets，编译时通过 option_env!() 注入二进制文件
# 编译时环境变量说明见 ENV_VARS.md
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        type: choice
        options:
          - linux-x64
          - windows-x64
          - all
        default: linux-x64
  push:
    tags:
      - "v*"
  release:
    types: [published]

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ===========================================================================
  # 编译前输出配置摘要（Secrets 值不显示，只显示是否已设置）
  # ===========================================================================
  config-summary:
    name: Build Configuration Summary
    runs-on: ubuntu-latest
    steps:
      - name: Show configuration
        run: |
          echo "============================================"
          echo "  RustDesk Custom Build Configuration"
          echo "  (all values from Actions Secrets)"
          echo "============================================"
          echo ""
          echo "--- Server Configuration ---"
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}" ]; then echo "  RENDEZVOUS_SERVERS: (set)"; else echo "  RENDEZVOUS_SERVERS: (not set, default: rs-ny.rustdesk.com)"; fi
          if [ -n "${{ secrets.RUSTDESK_CUSTOM_SERVER }}" ]; then echo "  CUSTOM_SERVER: (set)"; else echo "  CUSTOM_SERVER: (not set)"; fi
          if [ -n "${{ secrets.RUSTDESK_API_SERVER }}" ]; then echo "  API_SERVER: (set)"; else echo "  API_SERVER: (not set, derived from config)"; fi
          echo ""
          echo "--- Port Configuration ---"
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}" ]; then echo "  RENDEZVOUS_PORT: (set)"; else echo "  RENDEZVOUS_PORT: (not set, default: 21116)"; fi
          if [ -n "${{ secrets.RUSTDESK_RELAY_PORT }}" ]; then echo "  RELAY_PORT: (set)"; else echo "  RELAY_PORT: (not set, default: 21117)"; fi
          if [ -n "${{ secrets.RUSTDESK_WS_RENDEZVOUS_PORT }}" ]; then echo "  WS_RENDEZVOUS_PORT: (set)"; else echo "  WS_RENDEZVOUS_PORT: (not set, default: 21118)"; fi
          if [ -n "${{ secrets.RUSTDESK_WS_RELAY_PORT }}" ]; then echo "  WS_RELAY_PORT: (set)"; else echo "  WS_RELAY_PORT: (not set, default: 21119)"; fi
          echo ""
          echo "--- Update Check ---"
          if [ -n "${{ secrets.RUSTDESK_DISABLE_UPDATE }}" ]; then echo "  DISABLE_UPDATE: (set)"; else echo "  DISABLE_UPDATE: (not set, updates enabled)"; fi
          if [ -n "${{ secrets.RUSTDESK_UPDATE_URL }}" ]; then echo "  UPDATE_URL: (set)"; else echo "  UPDATE_URL: (not set, default: api.rustdesk.com)"; fi
          echo ""
          echo "--- Keys & Password ---"
          if [ -n "${{ secrets.RUSTDESK_RS_PUB_KEY }}" ]; then echo "  RS_PUB_KEY: (set)"; else echo "  RS_PUB_KEY: (not set, using default official key)"; fi
          if [ -n "${{ secrets.RUSTDESK_KEY }}" ]; then echo "  KEY: (set)"; else echo "  KEY: (not set)"; fi
          if [ -n "${{ secrets.RUSTDESK_PRESET_PASSWORD }}" ]; then echo "  PRESET_PASSWORD: (set)"; else echo "  PRESET_PASSWORD: (not set)"; fi
          echo ""
          echo "============================================"

  # ===========================================================================
  # Linux x86_64 编译
  # ===========================================================================
  build-linux:
    name: Build Linux x86_64
    needs: config-summary
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.target == 'linux-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            libgtk-3-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            nasm \
            wget \
            unzip

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Build RustDesk (with env var injection from Secrets)
        run: flutter build linux --release
        env:
          # === 所有配置统一从 Actions Secrets 读取 ===
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_CUSTOM_SERVER: ${{ secrets.RUSTDESK_CUSTOM_SERVER }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_WS_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_WS_RENDEZVOUS_PORT }}
          RUSTDESK_WS_RELAY_PORT: ${{ secrets.RUSTDESK_WS_RELAY_PORT }}
          RUSTDESK_DISABLE_UPDATE: ${{ secrets.RUSTDESK_DISABLE_UPDATE }}
          RUSTDESK_UPDATE_URL: ${{ secrets.RUSTDESK_UPDATE_URL }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}

      - name: Package Linux build
        run: |
          cd flutter/build/linux/x64/release/bundle
          tar czf /tmp/rustdesk-linux-x64.tar.gz .
          echo "Linux package created at /tmp/rustdesk-linux-x64.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x64
          path: /tmp/rustdesk-linux-x64.tar.gz
          retention-days: 30

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/rustdesk-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Windows x86_64 编译
  # ===========================================================================
  build-windows:
    name: Build Windows x86_64
    needs: config-summary
    runs-on: windows-2022
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.target == 'windows-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkg-json: ./vcpkg.json

      - name: Build RustDesk (with env var injection from Secrets)
        run: flutter build windows --release
        env:
          # === 所有配置统一从 Actions Secrets 读取 ===
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_CUSTOM_SERVER: ${{ secrets.RUSTDESK_CUSTOM_SERVER }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_WS_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_WS_RENDEZVOUS_PORT }}
          RUSTDESK_WS_RELAY_PORT: ${{ secrets.RUSTDESK_WS_RELAY_PORT }}
          RUSTDESK_DISABLE_UPDATE: ${{ secrets.RUSTDESK_DISABLE_UPDATE }}
          RUSTDESK_UPDATE_URL: ${{ secrets.RUSTDESK_UPDATE_URL }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
          VCPKG_ROOT: ${{ steps.setup-vcpkg.outputs.vcpkg-path }}

      - name: Package Windows build
        run: |
          Compress-Archive -Path flutter\build\windows\x64\runner\Release\* -DestinationPath rustdesk-windows-x64.zip
          echo "Windows package created"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: rustdesk-windows-x64.zip
          retention-days: 30

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: rustdesk-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
