name: Custom Build

# =============================================================================
# RustDesk 自定义编译 workflow
#
# 使用方法：
# 1. 在仓库 Settings → Secrets and variables → Actions → Secrets 中添加所有变量
# 2. 手动触发此 workflow (Run workflow)，输入版本号，或推送 tag 触发
#
# 所有配置统一使用 Actions Secrets，编译时通过 option_env!() 注入二进制文件
# 编译时环境变量说明见 ENV_VARS.md
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.5.1)"
        required: true
        default: "1.5.1"
        type: string
      build_number:
        description: "构建号 (Flutter build number，留空则自动用时间戳)"
        required: false
        default: ""
        type: string
      target:
        description: "Build target"
        type: choice
        options:
          - linux-x64
          - windows-x64
          - all
        default: linux-x64
      create_release:
        description: "编译后创建 GitHub Release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  release:
    types: [published]

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ===========================================================================
  # 准备阶段：确定版本号、输出配置摘要
  # ===========================================================================
  prepare:
    name: Prepare & Show Config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      build_number: ${{ steps.set-version.outputs.build_number }}
      tag: ${{ steps.set-version.outputs.tag }}
    steps:
      - name: Determine version
        id: set-version
        run: |
          # 确定版本号来源：
          # - 手动触发：使用 inputs.version
          # - tag 触发：从 tag 名提取 (v1.5.1 → 1.5.1)
          # - release 触发：从 release tag 提取
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            BUILD_NUMBER="${{ inputs.build_number }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            BUILD_NUMBER=""
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            BUILD_NUMBER=""
          fi

          # 如果未提供 build_number，用当前时间戳生成
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(date +%s)
          fi

          TAG="v${VERSION}"
          echo "Version: $VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "Tag: $TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Show configuration
        run: |
          echo "============================================"
          echo "  RustDesk Custom Build"
          echo "============================================"
          echo ""
          echo "--- Version ---"
          echo "  Version:      ${{ steps.set-version.outputs.version }}"
          echo "  Build number: ${{ steps.set-version.outputs.build_number }}"
          echo "  Tag:          ${{ steps.set-version.outputs.tag }}"
          echo ""
          echo "--- Server Configuration (from Secrets) ---"
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}" ]; then echo "  RENDEZVOUS_SERVERS: (set)"; else echo "  RENDEZVOUS_SERVERS: (default: rs-ny.rustdesk.com)"; fi
          if [ -n "${{ secrets.RUSTDESK_API_SERVER }}" ]; then echo "  API_SERVER: (set)"; else echo "  API_SERVER: (derived)"; fi
          echo ""
          echo "--- Ports ---"
          if [ -n "${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}" ]; then echo "  RENDEZVOUS_PORT: (set)"; else echo "  RENDEZVOUS_PORT: (default: 21116)"; fi
          if [ -n "${{ secrets.RUSTDESK_RELAY_PORT }}" ]; then echo "  RELAY_PORT: (set)"; else echo "  RELAY_PORT: (default: 21117)"; fi
          echo ""
          echo "--- Update Check ---"
          echo "  Updates: PERMANENTLY DISABLED (hardcoded)"
          echo ""
          echo "--- Keys & Password ---"
          if [ -n "${{ secrets.RUSTDESK_RS_PUB_KEY }}" ]; then echo "  RS_PUB_KEY: (set)"; else echo "  RS_PUB_KEY: (default official key)"; fi
          if [ -n "${{ secrets.RUSTDESK_PRESET_PASSWORD }}" ]; then echo "  PRESET_PASSWORD: (set)"; else echo "  PRESET_PASSWORD: (not set)"; fi
          echo ""
          echo "============================================"

  # ===========================================================================
  # Linux x86_64 编译
  # ===========================================================================
  build-linux:
    name: Build Linux x86_64
    needs: prepare
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.target == 'linux-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          echo "Setting version to $VERSION (build $BUILD_NUMBER)"

          # 更新 Cargo.toml 版本号
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Cargo.toml version updated to $VERSION"

          # 更新 flutter/pubspec.yaml 版本号
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml
          echo "pubspec.yaml version updated to ${VERSION}+${BUILD_NUMBER}"

          # 验证
          echo "--- Cargo.toml ---"
          grep '^version' Cargo.toml
          echo "--- pubspec.yaml ---"
          grep '^version:' flutter/pubspec.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            libgtk-3-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            nasm \
            wget \
            unzip

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Build RustDesk (with env var injection from Secrets)
        run: flutter build linux --release
        env:
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}

      - name: Package Linux build
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd flutter/build/linux/x64/release/bundle
          tar czf /tmp/rustdesk-${VERSION}-linux-x64.tar.gz .
          echo "Linux package: /tmp/rustdesk-${VERSION}-linux-x64.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-linux-x64
          path: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          retention-days: 30

      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          body: |
            RustDesk ${{ needs.prepare.outputs.version }}

            Custom build with compile-time env var injection.
            See [ENV_VARS.md](ENV_VARS.md) for configuration details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release (tag trigger)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/rustdesk-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Windows x86_64 编译
  # ===========================================================================
  build-windows:
    name: Build Windows x86_64
    needs: prepare
    runs-on: windows-2022
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.target == 'windows-x64' || inputs.target == 'all'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set version number
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          echo "Setting version to $VERSION (build $BUILD_NUMBER)"

          # 更新 Cargo.toml 版本号
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Cargo.toml version updated to $VERSION"

          # 更新 flutter/pubspec.yaml 版本号
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" flutter/pubspec.yaml
          echo "pubspec.yaml version updated to ${VERSION}+${BUILD_NUMBER}"

          # 验证
          echo "--- Cargo.toml ---"
          grep '^version' Cargo.toml
          echo "--- pubspec.yaml ---"
          grep '^version:' flutter/pubspec.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install RustDesk flutter rust bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid"
          dart pub global activate ffigen --version 5.0.2

      - name: Generate flutter rust bridge
        run: |
          flutter pub get
          cargo install cargo-expand --version 1.0.95
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/lib/generated_bridge.h

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkg-json: ./vcpkg.json

      - name: Build RustDesk (with env var injection from Secrets)
        run: flutter build windows --release
        env:
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ secrets.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_API_SERVER: ${{ secrets.RUSTDESK_API_SERVER }}
          RUSTDESK_RENDEZVOUS_PORT: ${{ secrets.RUSTDESK_RENDEZVOUS_PORT }}
          RUSTDESK_RELAY_PORT: ${{ secrets.RUSTDESK_RELAY_PORT }}
          RUSTDESK_RS_PUB_KEY: ${{ secrets.RUSTDESK_RS_PUB_KEY }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
          VCPKG_ROOT: ${{ steps.setup-vcpkg.outputs.vcpkg-path }}

      - name: Package Windows build
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path flutter\build\windows\x64\runner\Release\* -DestinationPath rustdesk-${VERSION}-windows-x64.zip
          echo "Windows package: rustdesk-${VERSION}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ needs.prepare.outputs.version }}-windows-x64
          path: rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
          retention-days: 30

      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
          body: |
            RustDesk ${{ needs.prepare.outputs.version }}

            Custom build with compile-time env var injection.
            See [ENV_VARS.md](ENV_VARS.md) for configuration details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing release (tag trigger)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: rustdesk-${{ needs.prepare.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
